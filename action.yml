name: 'TileSmith QC'
description: >
  Free tile-quality gate for game projects by TileSmith Studio: scores tiles for
  production readiness (seams, borders, artifacts), writes overlay images and a
  report, and comments on pull requests. Zero-retention: images are scored in
  RAM and never stored.
branding:
  icon: grid
  color: green
inputs:
  api-key:
    description: 'TileSmith API key (tsmith_live_…). Optional: if empty (e.g. fork PRs without secrets), the action skips QC with a notice instead of failing.'
    required: false
  paths:
    description: 'Comma-separated glob patterns (** crosses directories, * stays in one segment)'
    required: false
    default: 'assets/**'
  fail-on:
    description: 'Reject | Review | never'
    required: false
    default: 'Reject'
  max-files:
    description: 'Max tiles per run (1–500)'
    required: false
    default: '100'
  upload-report:
    description: 'Upload aggregate report to TileSmith API'
    required: false
    default: 'true'
outputs:
  production:
    description: 'Number of Production tiles'
  review:
    description: 'Number of Review tiles'
  reject:
    description: 'Number of Reject tiles'
  skipped:
    description: 'Number of tiles that could not be scored (network/API errors)'
  avg:
    description: 'Average score'
  report:
    description: 'Path to tilesmith-report/report.json'
runs:
  using: 'node24'
  main: 'dist/index.mjs'
